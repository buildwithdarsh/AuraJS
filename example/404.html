<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — AuraJS</title>
  <meta name="description" content="The page you are looking for does not exist. Return to the AuraJS homepage to explore 20 lightweight JavaScript modules with zero dependencies." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://aurajs-delta.vercel.app/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #000000;
      --text: #f5f5f7;
      --text-secondary: #86868b;
      --accent: #2997ff;
      --accent-hover: #0077ed;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 480px; }
    .code {
      font-size: 96px;
      font-weight: 700;
      letter-spacing: -4px;
      background: linear-gradient(135deg, var(--accent), #bf5af2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
    p { color: var(--text-secondary); font-size: 16px; line-height: 1.5; margin-bottom: 32px; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 980px;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.3s ease;
    }
    .btn:hover { background: var(--accent-hover); }
    .links { margin-top: 24px; display: flex; gap: 24px; justify-content: center; }
    .links a { color: var(--accent); text-decoration: none; font-size: 14px; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved. Head back to explore all 20 AuraJS modules.</p>
    <a href="/" class="btn">Back to Homepage</a>
    <div class="links">
      <a href="/docs/router.html">Docs</a>
      <a href="https://github.com/buildwithdarsh/AuraJS" rel="noopener" target="_blank">GitHub</a>
    </div>
  </div>
  <noscript>
    <p>AuraJS is a lightweight JavaScript framework. Please enable JavaScript or visit the <a href="https://github.com/buildwithdarsh/AuraJS">GitHub repository</a> for documentation.</p>
  </noscript>
</body>
</html>
